services:
  research-agent:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/research_sessions.db
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
      - ./src:/app/src
      - ./tests:/app/tests
    ports:
      - "8501:7860"
    mem_limit: 512m
    cpus: "1.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Run Dashboard (default): docker compose up
    # Run CLI: docker compose run --rm research-agent python src/main.py "Topic"

  # Optional self-hosted metasearch for web and Reddit search (no API key). Started only with the
  # "searxng" profile: `docker compose --profile searxng up -d`, or COMPOSE_PROFILES=searxng in .env.
  # Point the agent at it with SEARXNG_URL=http://searxng:8080 and set SEARXNG_SECRET.
  # Not published on the host; ddgs stays the fallback when it is down.
  searxng:
    image: searxng/searxng:2026.11.1-10db664f1
    profiles: ["searxng"]
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
      - FORCE_OWNERSHIP=false  # do not chown the bind-mounted settings file on the host
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 256m
    cpus: "0.5"
