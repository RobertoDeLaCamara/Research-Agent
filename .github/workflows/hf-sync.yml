name: Sync to HuggingFace Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Without the HF_TOKEN secret the push can only fail (and did, on every push to main).
      # Skip with a visible notice instead; set the secret to enable the sync:
      #   gh secret set HF_TOKEN -R RobertoDeLaCamara/Research-Agent   (write token of the Space owner)
      - name: Check HF_TOKEN
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice title=HF sync skipped::HF_TOKEN secret is not set; the Space is not updated."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Spaces
        if: steps.token.outputs.present == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Actions"
          git config --global credential.helper store

          # Clone the HF Space repo
          git clone https://user:${HF_TOKEN}@huggingface.co/spaces/ecerocg/research-agent hf_repo

          # Sync all repo files (excluding .git and hf_spaces/)
          rsync -av --exclude='.git' --exclude='hf_spaces' --exclude='venv' --exclude='.venv' \
            ./ hf_repo/

          # Override root README with the HF-specific one (contains Space metadata)
          cp hf_spaces/README.md hf_repo/README.md

          cd hf_repo
          git add -A
          git diff --cached --quiet && echo "No changes to sync" && exit 0
          git commit -m "Sync from GitHub @ ${{ github.sha }}"
          git push https://user:${HF_TOKEN}@huggingface.co/spaces/ecerocg/research-agent main
